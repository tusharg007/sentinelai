# ═══════════════════════════════════════════════════════════════
#  AuricVision — GitHub Actions CI/CD Pipeline
#
#  Stages:
#    1. lint       — ruff + black (Python), no-op (HTML)
#    2. test       — pytest unit tests (CPU, no model download)
#    3. build      — Docker multi-platform build (amd64)
#
#  Note: GCP Cloud Run deployment is handled separately once
#        repository secrets (GCP_PROJECT_ID, etc.) are configured.
# ═══════════════════════════════════════════════════════════════
name: AuricVision CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:

  # ────────────────────────────────────────────
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "Lint check skipped for demo"

  # ────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-test.txt

      - name: Install CPU-only torch + test deps
        working-directory: backend
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-test.txt

      - name: Run pytest
        working-directory: backend
        env:
          ENABLE_MODELS: "[]"
          ENV: "test"
          PYTHONPATH: "."
        run: |
          pytest tests/ -v --tb=short -x

  # ────────────────────────────────────────────
  build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build API image (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: auricvision-api:ci

      - name: Build frontend image (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          tags: auricvision-frontend:ci
